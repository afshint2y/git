/* Overlay-only cover: page layout loads underneath without body{position:fixed}. */
#site-loader {
  position: fixed;
  inset: 0;
  z-index: 99999;
  width: 100%;
  max-width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: #fdfdfc;
  pointer-events: auto;
  touch-action: none;
  transition: opacity 50ms ease, visibility 50ms ease;
}

body[data-site-loaded] #site-loader {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

#site-loader-stage,
#site-loader-percent {
  transition: opacity 250ms ease;
}

body[data-site-loader-outro] #site-loader-stage,
body[data-site-loader-outro] #site-loader-percent {
  opacity: 0;
}

#site-loader-stage {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(308px, 58vw);
  height: min(308px, 58vw);
  transform: translate(-50%, -50%);
}

#site-loader-stage #hs-loader-video-wrap {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 58%;
  height: 58%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  overflow: hidden;
  -webkit-mask-image: -webkit-radial-gradient(white, black);
  mask-image: radial-gradient(circle, #000 99%, transparent 100%);
  will-change: transform;
}

#site-loader-stage #hs-loader-video {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  pointer-events: none;
  /* Kill encoder fringe / near-white edges against the #fdfdfc loader bg. */
  mix-blend-mode: multiply;
  transform: scale(1.08);
}

#site-loader-stage #hs-loader-logo {
  display: none;
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
}

/* iOS WebKit: autoplay video is unreliable &mdash; spin the brand mark instead. */
@supports (-webkit-touch-callout: none) {
  #site-loader-stage #hs-loader-video {
    display: none !important;
  }
  #site-loader-stage #hs-loader-logo {
    display: block;
  }
}

/* Safari iOS shows a native play glyph when autoplay is blocked &mdash; hide it. */
#hs-loader-video::-webkit-media-controls {
  display: none !important;
}
#hs-loader-video::-webkit-media-controls-enclosure {
  display: none !important;
}
#hs-loader-video::-webkit-media-controls-start-playback-button {
  display: none !important;
  -webkit-appearance: none;
}

/* After the intro clip plays once, spin the frozen last frame while assets load. */
@keyframes hs-loader-spin {
  from {
    transform: translate(-50%, -50%) rotate(0deg);
  }
  to {
    transform: translate(-50%, -50%) rotate(120deg);
  }
}

body[data-site-loader-loop] #hs-loader-video-wrap {
