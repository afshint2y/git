<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pocky Proposal</title>
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Heli Studio proposal system.
   Layout: Heli slide grammar on the web — corner meta pinned to the viewport, a header row (title left, line right),
   full-screen sections alternating ink and paper, a narrative stage label in the footer.
   Two layers: the presentation (always visible) and details (<details> panels, opened on demand). */
:root{
  --ink:#131313; --paper:#F6F6F6; --card:#E8E8E6; --card-2:#DEDEDB; --white:#FFFFFF;
  --line:#D5D5D1; --line-d:#353533; --mute:#8C8C86; --mute-d:#A9A9A3; --text-2:#3E3E3A; --on-ink:#F2F2EF;
  --lime:#FDF451;
  --metal:linear-gradient(135deg,#F4F4F4 0%,#BDBDBD 34%,#EDEDED 52%,#A9A9A9 78%,#D9D9D9 100%);
  --font:'Inter',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --t-meta:13px; --t-small:clamp(14px,1.02vw,16px); --t-body:clamp(16px,1.2vw,20px);
  --t-h3:clamp(18px,1.4vw,25px); --t-label:clamp(22px,1.9vw,36px); --t-h2:clamp(30px,3vw,58px);
  --t-display:clamp(40px,4.2vw,84px); --t-num:clamp(36px,3.3vw,64px);
  --g:clamp(16px,2.6vw,50px); --gap:clamp(20px,2.4vw,44px);
  --pad-top:clamp(92px,11vh,132px); --pad-bot:clamp(84px,10vh,120px);
  --r-card:18px; --r-pill:999px;
  --ease:cubic-bezier(.2,.75,.1,1); --ease-io:cubic-bezier(.65,0,.35,1); --spring:cubic-bezier(.34,1.45,.62,1);
  --d1:.18s; --d2:.42s; --d3:.85s;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--ink);color:var(--on-ink);font-family:var(--font);font-size:var(--t-body);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:4px;border-radius:6px}
.light :focus-visible{outline-color:var(--ink)}
img,video{display:block;max-width:100%}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* placeholders: anything not yet confirmed is visibly marked, never presented as fact */
.tbc{display:inline-flex;align-items:center;gap:7px;font-size:.88em;color:var(--mute);white-space:nowrap}
.tbc::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--yg);box-shadow:0 0 0 1px var(--ink)}
.dark .tbc{color:var(--mute-d)}
.est{font-size:var(--t-meta);color:var(--mute);text-transform:uppercase;letter-spacing:.06em}

/* ── fixed corner meta ── */
.corner{position:fixed;z-index:50;color:#fff;mix-blend-mode:difference;font-size:var(--t-meta);pointer-events:none}
.corner a{pointer-events:auto}
.c-tl{left:var(--g);top:calc(26px + env(safe-area-inset-top,0px))}
.c-tr{right:var(--g);top:calc(20px + env(safe-area-inset-top,0px))}
.c-tr a{display:block;width:44px;height:40px}
.c-bl{left:var(--g);bottom:calc(22px + env(safe-area-inset-bottom,0px))}
.c-br{right:var(--g);bottom:calc(22px + env(safe-area-inset-bottom,0px))}
.mark{width:100%;height:100%;fill:currentColor;transition:transform var(--d3) var(--ease)}
#secLabel{display:inline-flex;gap:10px;transition:opacity var(--d1)}
#secLabel .stage{opacity:.6}
#secLabel.swap{opacity:0}
.progress{position:fixed;left:0;top:0;height:2px;width:100%;z-index:52;background:var(--yg);transform-origin:left;transform:scaleX(0)}

/* section navigator: ticket perforation dots */
.perf-nav{position:fixed;z-index:51;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:7px;align-items:center;
  padding:10px 16px;border-radius:var(--r-pill);background:rgba(19,19,19,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.perf-nav button{width:7px;height:7px;border-radius:50%;background:#5A5A57;transition:transform var(--d2) var(--spring),background var(--d1)}
.perf-nav button:hover,.perf-nav button:focus-visible{transform:scale(1.7);background:#CFCFCA}
.perf-nav button.on{background:var(--yg);transform:scale(1.45)}
.perf-nav i{width:1px;height:12px;background:#4A4A47;margin:0 3px}
.perf-nav .tip{position:absolute;bottom:calc(100% + 10px);left:0;white-space:nowrap;font-size:12px;background:var(--paper);color:var(--ink);padding:5px 10px;border-radius:var(--r-pill);
  opacity:0;transform:translateY(4px);transition:opacity var(--d1),transform var(--d1);pointer-events:none}
.perf-nav .tip.show{opacity:1;transform:none}
@media (max-width:760px){.perf-nav{display:none}}

/* ── sections ── */
.s{position:relative;min-height:100svh;padding:var(--pad-top) var(--g) var(--pad-bot);display:flex;flex-direction:column;justify-content:center;gap:clamp(32px,4.2vw,68px)}
.s>*{min-width:0}
.s.light{background:var(--paper);color:var(--ink)}
.s.dark{background:var(--ink);color:var(--on-ink)}
.sh{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,3vw,48px);align-items:end}
.sh h2{justify-self:start;font-size:var(--t-label);font-weight:450;letter-spacing:-.025em;line-height:1.04;text-transform:uppercase;text-wrap:balance;display:inline-block;transition:transform .9s var(--spring)}
.sh h2.pull{transition:transform .25s var(--ease)}
.sh .q{justify-self:end;text-align:right;font-size:var(--t-small);line-height:1.45;max-width:40ch;color:var(--text-2)}
.dark .sh .q{color:var(--mute-d)}
.sh .q b{display:block;font-weight:500;color:inherit;font-size:var(--t-meta);text-transform:uppercase;letter-spacing:.06em;opacity:.7;margin-bottom:4px}
@media (max-width:700px){.sh{grid-template-columns:1fr;gap:10px}.sh .q{justify-self:start;text-align:left}}
.grow{flex:1 1 auto;min-height:0}
.lead{font-size:var(--t-h2);font-weight:430;letter-spacing:-.035em;line-height:1.06;max-width:22ch;text-wrap:balance}
.lead .grey{color:#A2A29C}
.dark .lead .grey{color:var(--mute)}
.body{font-size:var(--t-body);line-height:1.55;color:var(--text-2);max-width:60ch;text-wrap:pretty}
.dark .body{color:var(--mute-d)}
.k{font-size:var(--t-meta);color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.dark .k{color:var(--mute-d)}
.cols{display:grid;gap:var(--gap)}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.rule{padding-top:clamp(16px,1.6vw,24px);border-top:1px solid var(--line)}
.dark .rule{border-color:var(--line-d)}
@media (max-width:860px){.c3,.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.c2,.c3,.c4{grid-template-columns:1fr}}

/* the details layer */
.more{border-top:1px solid var(--line)}
.dark .more{border-color:var(--line-d)}
.more>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;font-size:var(--t-small);font-weight:500}
.more>summary::-webkit-details-marker{display:none}
.more>summary .pm{width:28px;height:28px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;flex:none;transition:transform var(--d2) var(--ease),background var(--d2),color var(--d2)}
.more>summary:hover .pm{background:var(--ink);color:var(--paper)}
.dark .more>summary:hover .pm{background:var(--paper);color:var(--ink)}
.more[open]>summary .pm{transform:rotate(45deg)}
.more .inner{padding:4px 0 24px}
.spec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:10px var(--gap)}
.spec dt{font-size:var(--t-meta);color:var(--mute);text-transform:uppercase;letter-spacing:.06em;padding-top:12px;border-top:1px solid var(--line)}
.spec dd{font-size:var(--t-small);padding-top:10px;border-top:1px solid var(--line)}
.dark .spec dt,.dark .spec dd{border-color:var(--line-d)}
@media (max-width:560px){.spec{grid-template-columns:1fr}.spec dd{border-top:0;padding-top:0}}

/* tabs (service switcher) */
.tabs{display:inline-flex;gap:6px;padding:5px;border-radius:var(--r-pill);background:var(--card)}
.dark .tabs{background:#232322}
.tabs button{padding:9px 18px;border-radius:var(--r-pill);font-size:var(--t-small);transition:background var(--d2),color var(--d2)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--on-ink)}
.dark .tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink)}
.tabs button[hidden]{display:none}

/* reveals: visible at rest, rise in where supported */
@media (prefers-reduced-motion:no-preference){@supports (animation-timeline:view()){
  .rv{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 40%}
}}
@keyframes rise{from{opacity:0;transform:translateY(32px)}}

/* intro counter, after heli.studio's 0 to 100% loader */
.loader{display:none}
.js .loader{position:fixed;inset:0;z-index:100;background:var(--ink);color:var(--on-ink);display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 var(--g) calc(26px + env(safe-area-inset-bottom,0px));animation:lout .9s 1.25s var(--ease-io) forwards}
.loader svg{position:absolute;left:50%;top:50%;width:44px;height:40px;margin:-20px 0 0 -22px;fill:currentColor;animation:lspin 1.25s var(--ease-io) both}
.loader .lpct{font-size:var(--t-num);font-weight:400;letter-spacing:-.04em;line-height:1}
.loader .lnm{font-size:var(--t-meta);color:var(--mute-d)}
@keyframes lout{to{transform:translateY(-100%);visibility:hidden}}
@keyframes lspin{from{transform:rotate(-120deg) scale(.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.js .loader{display:none}}
/* ── 01 cover ── */
.cover{justify-content:flex-end;gap:clamp(28px,4vw,56px);padding-top:120px;padding-bottom:clamp(64px,9vh,104px);overflow:hidden}
.cover .deck{position:absolute;left:var(--g);top:calc(54px + env(safe-area-inset-top,0px));font-size:var(--t-meta);color:var(--mute-d)}
.film{position:relative;flex:1 1 auto;min-height:clamp(200px,30vh,320px);border-radius:var(--r-card);overflow:hidden;background:#000;margin-top:clamp(24px,4vh,48px)}
.film video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:right center}
.cover h1{font-size:var(--t-display);font-weight:430;letter-spacing:-.03em;line-height:1;text-transform:uppercase}
.cover h1 .grey{color:var(--mute-d)}
.cover .meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
.cover .meta div{padding-top:16px;border-top:1px solid var(--line-d)}
.cover .meta p:first-child{font-size:var(--t-meta);color:var(--mute);margin-bottom:6px}
.cover .meta p:last-child{font-size:var(--t-small)}
@media (max-width:760px){.cover .meta{grid-template-columns:1fr 1fr}}

/* ── 02 at a glance ── */
.glance-rows li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,3fr);gap:var(--gap);align-items:baseline;padding:clamp(14px,2vh,22px) 0;border-top:1px solid var(--line)}
.glance-rows .k{padding-top:.3em}
.glance-rows p:last-child{font-size:var(--t-h3);letter-spacing:-.015em;line-height:1.35;max-width:52ch}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
.facts>div{background:var(--ink);color:var(--on-ink);border-radius:var(--r-card);padding:clamp(16px,1.6vw,26px);display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:132px}
.facts .v{font-size:clamp(26px,2.4vw,44px);font-weight:400;letter-spacing:-.04em;line-height:1}
.facts .v small{font-size:.45em;letter-spacing:0;color:var(--mute-d);margin-left:6px}
.facts .k{color:var(--mute-d)}
.facts .accent{background:var(--yg);color:var(--ink)} .facts .accent .k{color:var(--text-2)}
@media (max-width:700px){.glance-rows li{grid-template-columns:1fr;gap:6px}.facts{grid-template-columns:1fr 1fr}}

/* ── 03 challenge ── */
.ch-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(28px,4vw,80px);align-items:start}
.ch-grid .lead{margin-bottom:clamp(20px,2vw,32px);font-size:var(--t-display);font-weight:500;letter-spacing:-.04em}
.wt span span{display:inline-block;transition:font-weight .35s var(--ease)}
.ch-grid .body+.body{margin-top:14px}
.confirm h3{font-size:var(--t-small);font-weight:500;margin-bottom:6px}
.confirm li{display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line);font-size:var(--t-small)}
@media (max-width:860px){.ch-grid{grid-template-columns:1fr}}

/* ── 04 objectives ── */
.obj{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 var(--gap);counter-reset:o}
.obj li{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:4px 12px;padding:clamp(18px,2.6vh,30px) 0;border-top:1px solid var(--line);position:relative}
.obj li::after{content:"";position:absolute;left:0;top:-1px;height:1px;width:100%;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .7s var(--ease)}
.obj li:hover::after{transform:scaleX(1)}
.obj .no{font-size:var(--t-meta);color:var(--mute);padding-top:.5em}
.obj h3{font-size:var(--t-h3);font-weight:500;letter-spacing:-.02em}
.obj p{grid-column:2;font-size:var(--t-small);color:var(--text-2);max-width:46ch}
@media (max-width:700px){.obj{grid-template-columns:1fr}}

/* ── 05 perspective ── */
.persp .lead{max-width:26ch}
.persp .cols p.t{font-size:var(--t-small);line-height:1.55;color:var(--mute-d);margin-top:10px;max-width:40ch}
.persp .cols h3{font-size:var(--t-h3);font-weight:500;letter-spacing:-.02em;color:var(--on-ink)}
.pills{display:flex;gap:clamp(8px,1vw,16px);height:clamp(100px,8vw,150px)}
.pill{flex:1 1 0;min-width:0;border-radius:var(--r-pill);overflow:hidden;background:#000;transition:flex-grow .8s var(--ease),border-radius .8s var(--ease)}
.pill img{width:100%;height:100%;object-fit:cover;filter:grayscale(1)}
.pill.on{flex-grow:2.1;border-radius:24px}
@media (max-width:760px){.pills{display:none}}

/* ── 06 solution ── */
.sol li{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1.1fr) 40px minmax(0,1fr);gap:12px;align-items:center;padding:clamp(18px,2.6vh,30px) 0;border-top:1px solid var(--line);transition:opacity var(--d2)}
.sol li.off{opacity:.32}
.sol .arrow{font-size:var(--t-h3);color:var(--mute);text-align:center}
.sol .k{display:block;margin-bottom:6px}
.sol .need,.sol .out{font-size:var(--t-small);color:var(--text-2);line-height:1.45}
.sol .svc{background:var(--ink);color:var(--on-ink);border-radius:var(--r-card);padding:clamp(16px,1.6vw,24px)}
.sol .svc h3{font-size:var(--t-h3);font-weight:500;letter-spacing:-.02em}
.sol .svc p{font-size:var(--t-small);color:var(--mute-d);margin-top:6px}
.sol li.off .svc{background:var(--card);color:var(--ink)} .sol li.off .svc p{color:var(--mute)}
.sol .flag{font-size:var(--t-meta);color:var(--mute);margin-left:8px}
.sol .seq{font-size:var(--t-small);color:var(--text-2);padding-top:16px;border-top:1px solid var(--line)}
@media (max-width:860px){.sol li{grid-template-columns:1fr;gap:10px}.sol .arrow{transform:rotate(90deg);text-align:left;width:20px}}

/* ── 07 work ── */
.cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,1.6vw,28px)}
.case{display:flex;flex-direction:column;gap:14px;text-align:left}
.case .frame{aspect-ratio:16/10;border-radius:var(--r-card);overflow:hidden;background:var(--card)}
.case .frame img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.case:hover .frame img{transform:scale(1.05)}
.case .cap{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:var(--t-small)}
.case .cap b{font-weight:600} .case .cap span{color:var(--mute)}
.case .open{font-size:var(--t-meta);border:1px solid currentColor;border-radius:var(--r-pill);padding:4px 12px;transition:background var(--d2),color var(--d2)}
.case:hover .open{background:var(--ink);color:var(--on-ink)}
.creds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
.creds .n{font-size:var(--t-num);font-weight:400;letter-spacing:-.045em;line-height:1}
.creds p:last-child{font-size:var(--t-small);color:var(--text-2);margin-top:8px}
.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.strip a{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--ink);color:var(--on-ink);text-decoration:none;display:flex;align-items:flex-end;padding:10px;font-size:12px;line-height:1.25;isolation:isolate}
.strip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1);z-index:-2;transition:transform .8s var(--ease)}
.strip a::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(19,19,19,.85));z-index:-1}
.strip a:hover img{transform:scale(1.08)}
.strip .ph-note{position:absolute;top:8px;left:8px;font-size:10px;background:rgba(246,246,246,.9);color:var(--ink);padding:2px 7px;border-radius:var(--r-pill)}
@media (max-width:860px){.strip{grid-template-columns:repeat(3,minmax(0,1fr))}.creds{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.cases{grid-template-columns:1fr}}

/* drawer (case study detail layer) */
.drawer{position:fixed;inset:0;z-index:90;display:flex;justify-content:flex-end;background:rgba(19,19,19,.5);opacity:0;pointer-events:none;transition:opacity var(--d2)}
.drawer.open{opacity:1;pointer-events:auto}
.drawer .panel{width:min(560px,100%);height:100%;background:var(--paper);color:var(--ink);overflow:auto;padding:clamp(24px,3vw,44px);transform:translateX(40px);transition:transform var(--d2) var(--ease);display:flex;flex-direction:column;gap:24px}
.drawer.open .panel{transform:none}
.drawer .x{align-self:flex-end;width:40px;height:40px;border-radius:50%;border:1px solid var(--ink);display:grid;place-items:center;font-size:18px}
.drawer .x:hover{background:var(--ink);color:var(--paper)}
.drawer h3{font-size:var(--t-label);font-weight:450;letter-spacing:-.025em;text-transform:uppercase}
.drawer .frame{border-radius:var(--r-card);overflow:hidden;aspect-ratio:16/10;background:var(--card)}
.drawer .frame img{width:100%;height:100%;object-fit:cover}

/* ── 08 scope ── */
.scope-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.scope-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,3vw,56px)}
.scope-grid h3{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--t-small);font-weight:500;padding-bottom:12px;border-bottom:1px solid var(--ink);margin-bottom:4px}
.scope-grid h3 span{font-size:var(--t-meta);color:var(--mute);font-weight:400}
.scope-grid li{display:flex;justify-content:space-between;gap:12px;font-size:var(--t-small);padding:11px 0;border-bottom:1px solid var(--line)}
.scope-grid li i{font-style:normal;font-size:var(--t-meta);color:var(--mute);white-space:nowrap}
.scope-grid .deliv li{font-size:var(--t-h3);letter-spacing:-.015em;padding:12px 0}
.scope-grid .deliv li.sub{font-size:var(--t-small);padding-left:1.4em;color:var(--text-2)}
@media (max-width:760px){.scope-grid{grid-template-columns:1fr}}

/* ── 09 process: accordion strip; the open phase carries its own motion mark ── */
.acc{display:flex;gap:clamp(8px,.8vw,14px);height:clamp(380px,52vh,500px)}
.ph{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:space-between;text-align:left;padding:clamp(16px,1.5vw,24px);
  border-radius:var(--r-card);background:var(--card);color:var(--ink);overflow:hidden;transition:flex-grow .75s var(--ease),background var(--d2),color var(--d2)}
.ph.on{flex-grow:3.6;background:var(--ink);color:var(--on-ink)}
.ph:not(.on):hover{background:var(--card-2)}
.ph-top{display:flex;justify-content:space-between;gap:12px;font-size:var(--t-meta)}
.ph .wk{color:var(--mute);white-space:nowrap;opacity:0;transition:opacity var(--d2)}
.ph.on .wk{opacity:1;color:var(--mute-d)}
.ph-art{position:absolute;right:clamp(18px,2vw,32px);top:22%;width:clamp(90px,8vw,140px);opacity:0;transition:opacity .4s}
.ph.on .ph-art{opacity:1;transition-delay:.3s}
.ph-art svg{width:100%;height:auto;fill:none;stroke:currentColor;stroke-width:1.5}
.ph-art .fill{fill:currentColor} .ph-art .lime{fill:var(--lime);stroke:var(--lime)} .ph-art .sheet{fill:var(--ink)}
.ph-bot{display:grid;gap:12px}
.ph .nm{font-size:clamp(15px,1.15vw,20px);font-weight:500;letter-spacing:-.02em;line-height:1.15}
.ph.on .nm{font-size:var(--t-label);font-weight:450;letter-spacing:-.03em;max-width:14ch}
.ph-body{display:none;gap:12px}
.ph.on .ph-body{display:grid;animation:fade .5s .2s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.ph-body .purpose{font-size:var(--t-small);color:var(--mute-d);max-width:48ch}
.ph-body .dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;font-size:var(--t-small)}
.ph-body .dt{display:block;font-size:11px;color:var(--mute-d);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.ph-body .gate{justify-self:start;background:var(--yg);color:var(--ink);font-size:var(--t-meta);font-weight:500;padding:6px 12px;border-radius:var(--r-pill)}
@media (prefers-reduced-motion:no-preference){
  .ph.on .g1 .lens{animation:scan 3.2s var(--ease-io) infinite}
  .ph.on .ray{stroke-dasharray:60;animation:draw 2.4s var(--ease) infinite}
  .ph.on .ray:nth-of-type(2){animation-delay:.15s}.ph.on .ray:nth-of-type(3){animation-delay:.3s}
  .ph.on .g3 .core{animation:pulse 2.4s var(--ease) infinite;transform-origin:96px 60px}
  .ph.on .g4 rect,.ph.on .g4 circle,.ph.on .g4 text{animation:pop 2.8s var(--spring) infinite}
  .ph.on .g4 :nth-child(2){animation-delay:.12s}.ph.on .g4 :nth-child(3){animation-delay:.24s}.ph.on .g4 :nth-child(4){animation-delay:.36s}
  .ph.on .g5 .sheet{animation:fan 2.8s var(--ease-io) infinite;transform-origin:60px 100px}
  .ph.on .g5 .sheet:nth-child(1){--r:-14deg}.ph.on .g5 .sheet:nth-child(3){--r:14deg}
  .ph.on .g6 .pg{animation:flip 2.6s var(--ease-io) infinite;transform-origin:60px 60px}
}
@keyframes scan{0%,100%{transform:translate(-14px,-10px)}33%{transform:translate(14px,-4px)}66%{transform:translate(-4px,14px)}}
@keyframes draw{0%{stroke-dashoffset:60}60%,100%{stroke-dashoffset:0}}
@keyframes pulse{0%,40%{transform:scale(.4);opacity:.3}70%,100%{transform:scale(1);opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}25%,85%{transform:none;opacity:1}100%{opacity:0}}
@keyframes fan{0%,15%{transform:none}50%,80%{transform:rotate(var(--r,0deg))}100%{transform:none}}
@keyframes flip{0%,20%{transform:scaleX(1)}50%{transform:scaleX(-.05)}80%,100%{transform:scaleX(1)}}
.g4 *{transform-box:fill-box;transform-origin:center}
@media (max-width:900px){.acc{flex-direction:column;height:auto}.ph{flex:none;min-height:64px;gap:12px}.ph .wk{opacity:1}.ph-art{display:none}.ph-body .dl{grid-template-columns:1fr}}

/* ── 10 timeline: pinned on desktop, the playhead follows scroll ── */
.tl{display:block;padding:0;background:var(--paper);color:var(--ink)}
.tl .stick{min-height:100svh;padding:var(--pad-top) var(--g) var(--pad-bot);display:flex;flex-direction:column;justify-content:center;gap:clamp(28px,3.4vw,56px)}
@media (min-width:1000px) and (min-height:720px) and (prefers-reduced-motion:no-preference){
  .tl.pin{height:300vh}
  .tl.pin .stick{position:sticky;top:0;min-height:100vh}
}
.chart{position:relative;display:grid;gap:clamp(18px,2.4vh,30px)}
.blk-name{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:4px}
.blk-name b{font-size:var(--t-small);font-weight:500}
.blk-name b span{color:var(--mute);font-weight:400;margin-left:8px}
.blk-name em{font-style:normal;font-size:var(--t-meta);color:var(--mute)}
.sessions{position:relative;height:var(--sh,46px)}
.bub{position:absolute;bottom:calc(var(--lv,0) * 40px + 8px);transform:translateX(-50%);background:var(--yg);color:var(--ink);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.03em;
  padding:8px 14px;border-radius:var(--r-pill);white-space:nowrap}
.bub small{font-size:11px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-2);margin-left:6px}
.bub::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;margin-left:-5px;background:var(--yg);transform:rotate(45deg);border-radius:2px}
.bub.l{transform:none}.bub.l::after{left:16px}
.bub.r{transform:translateX(-100%)}.bub.r::after{left:auto;right:11px}
.grid-box{position:relative;border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.wk-head{display:grid;border-bottom:1px solid var(--line)}
.wk-head button{padding:12px 0;text-align:center;font-size:var(--t-small);font-weight:500;text-transform:uppercase;letter-spacing:.02em;color:var(--mute);border-left:1px solid var(--line);transition:color var(--d2),background var(--d2)}
.wk-head button:first-child{border-left:0}
.wk-head button:hover{background:var(--card)}
.wk-head button.past{color:var(--ink)}
.rows{position:relative;padding:clamp(8px,1.4vh,14px) 0;background:repeating-linear-gradient(90deg,transparent 0 calc(100% / var(--w) - 1px),var(--line) calc(100% / var(--w) - 1px) calc(100% / var(--w)))}
.row{position:relative;height:clamp(46px,5.6vh,54px)}
.bar{position:absolute;top:50%;height:38px;margin-top:-19px;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:center;padding:0 16px;font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;
  background:var(--card);color:var(--ink);isolation:isolate;transition:background var(--d2),color var(--d2)}
.bar span{overflow:hidden;text-overflow:ellipsis}
.bar::before{content:"";position:absolute;inset:0;transform-origin:left;transform:scaleX(var(--p,0));z-index:-1;background:var(--yg);transition:transform .25s linear}
.bar.done{background:var(--ink);color:var(--on-ink)} .bar.done::before{opacity:0}
.chart.static .bar{background:var(--card);color:var(--ink)} .chart.static .bar::before{opacity:0} .chart.static .playhead{display:none}
.playhead.off{opacity:0}
.ph-layer{position:absolute;top:var(--headH,50px);bottom:0;left:0;right:0;pointer-events:none}
.playhead{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);left:0;z-index:3;pointer-events:none}
.playhead::before{content:"";position:absolute;top:-5px;left:-5px;width:11px;height:11px;border-radius:50%;background:var(--ink)}
.tl-foot{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--ink)}
.tl-foot .now{font-size:var(--t-h3);letter-spacing:-.015em}
.tl-foot .now b{font-weight:400;color:var(--mute);margin-right:10px}
.tl-foot .dates{font-size:var(--t-small);color:var(--text-2)}
@media (max-width:860px){.chart-wrap{overflow-x:auto}.chart{min-width:760px}}

/* ── 11 collaboration ── */
.collab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,3vw,56px)}
.collab h3{font-size:var(--t-label);font-weight:450;letter-spacing:-.025em;text-transform:uppercase;padding-bottom:14px;border-bottom:1px solid var(--ink);margin-bottom:4px}
.collab li{display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line);font-size:var(--t-small)}
.cadence{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
.cadence .v{font-size:var(--t-small);margin-top:6px}
@media (max-width:760px){.collab{grid-template-columns:1fr}.cadence{grid-template-columns:1fr 1fr}}

/* ── 12 investment ── */
.inv{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:clamp(16px,2vw,36px);align-items:start}
.pkgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.4vw,24px)}
.pkg{display:flex;flex-direction:column;gap:12px;text-align:left;width:100%;cursor:pointer;transition:transform .6s var(--spring)}
.pkg .tk{position:relative;background:var(--card);border-radius:var(--r-card);padding-bottom:22px;transition:background var(--d2),color var(--d2)}
.pkg .tk-h{padding:clamp(18px,1.8vw,28px) clamp(18px,1.8vw,28px) 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pkg .tk-h h3{font-size:clamp(18px,1.5vw,26px);font-weight:600;letter-spacing:-.015em;text-transform:uppercase}
.pkg .tk-h p{font-size:var(--t-small);color:var(--text-2);margin-top:6px;max-width:30ch}
.pkg .check{width:26px;height:26px;border-radius:50%;border:1px solid var(--ink);flex:none;display:grid;place-items:center;font-size:13px;transition:background var(--d2),color var(--d2)}
.perf{position:relative;display:flex;justify-content:space-between;align-items:center;height:20px;padding:0 clamp(22px,2vw,34px)}
.perf::before,.perf::after{content:"";position:absolute;top:50%;width:20px;height:20px;border-radius:50%;background:var(--paper);transform:translateY(-50%)}
.perf::before{left:-10px}.perf::after{right:-10px}
.perf i{width:8px;height:8px;border-radius:50%;background:var(--paper);display:block}
.pkg ul{padding:14px clamp(18px,1.8vw,28px) 0;display:grid;gap:8px}
.pkg li{font-size:var(--t-small);display:flex;gap:10px;align-items:baseline}
.pkg li::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:none;transform:translateY(-3px)}
.pkg li.sub{padding-left:16px;color:var(--text-2)}
.pkg .stub{background:var(--card);border-radius:var(--r-card);padding:16px;text-align:center;font-size:clamp(24px,2vw,36px);font-weight:500;letter-spacing:-.04em;transition:background var(--d2),transform .6s var(--spring)}
.pkg[aria-pressed="true"] .tk,.pkg[aria-pressed="true"] .stub{background:var(--ink);color:var(--on-ink)}
.pkg[aria-pressed="true"] .tk-h p,.pkg[aria-pressed="true"] li.sub{color:var(--mute-d)}
.pkg[aria-pressed="true"] .check{background:var(--yg);color:var(--ink);border-color:var(--lime)}
.pkg[aria-pressed="true"] .perf i{background:var(--paper)}
.pkg:hover{transform:translateY(-4px)}
.pkg.locked{cursor:not-allowed}
.total{position:sticky;top:110px;display:flex;flex-direction:column;transform:perspective(1200px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .8s var(--ease)}
.total.live{transition:transform .15s linear}
.t-main{position:relative;background:var(--ink);color:var(--on-ink);border-radius:var(--r-card) var(--r-card) 0 0;padding:clamp(20px,2vw,30px);display:grid;gap:8px;overflow:hidden}
.t-main::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--sx,30%) var(--sy,20%),rgba(255,255,255,.12),transparent 45%);pointer-events:none}
.t-main .k{color:var(--mute-d)}
.total .row{display:flex;justify-content:space-between;gap:12px;font-size:var(--t-small);padding:9px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.total .row.credit b{font-weight:600;color:var(--lime)}
.total .note{font-size:var(--t-meta);color:var(--mute-d);margin-top:6px}
.total .msg{font-size:var(--t-meta);color:var(--lime);min-height:1.2em}
.t-perf{position:relative;height:24px;background:radial-gradient(circle,var(--paper) 3.5px,transparent 4px) 0 50%/22px 24px repeat-x,linear-gradient(180deg,var(--ink) 50%,var(--lime) 50%)}
.t-perf::before,.t-perf::after{content:"";position:absolute;top:50%;width:24px;height:24px;margin-top:-12px;border-radius:50%;background:var(--paper)}
.t-perf::before{left:-12px}.t-perf::after{right:-12px}
.t-stub{background:var(--yg);color:var(--ink);border-radius:0 0 var(--r-card) var(--r-card);padding:clamp(18px,2vw,28px);display:flex;justify-content:space-between;align-items:flex-end;gap:12px;transition:transform .7s var(--spring)}
.t-stub .k{color:var(--text-2)}
.t-stub .sumv{display:flex;align-items:baseline;gap:10px}
.t-stub s{font-size:var(--t-h3);color:var(--text-2)}
.t-stub .amt{font-size:clamp(44px,4.2vw,76px);font-weight:400;letter-spacing:-.06em;line-height:.9}
.total:hover .t-stub{transform:translateY(5px) rotate(-.8deg)}
.pkg[aria-pressed="true"] .perf i{animation:hop .6s var(--spring) both;animation-delay:calc(var(--i) * 40ms)}
@keyframes hop{40%{transform:translateY(-6px) scale(1.25)}}
@media (max-width:960px){.inv{grid-template-columns:1fr}.total{position:static}}
@media (max-width:640px){.pkgs{grid-template-columns:1fr}}

/* ── 13 terms ── */
.terms-list .more>summary{font-size:var(--t-h3);font-weight:450;letter-spacing:-.015em;padding:18px 0}
.terms-list .more>summary .left{display:flex;gap:16px;align-items:baseline}
.terms-list .more>summary .left em{font-style:normal;font-size:var(--t-meta);color:var(--mute);width:2.4em}
.terms-list .inner p{font-size:var(--t-small);color:var(--text-2);max-width:70ch;padding-left:calc(2.4em + 16px)}
.terms-list .more:last-child{border-bottom:1px solid var(--line)}

/* ── 14 next steps ── */
.nx{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(28px,4vw,80px);align-items:stretch}
.nx-l{display:flex;flex-direction:column;justify-content:space-between;gap:36px}
.nx-t{font-size:var(--t-display);font-weight:430;letter-spacing:-.03em;line-height:1.05}
.nsteps li{display:grid;grid-template-columns:3.2em minmax(0,1fr);align-items:baseline;padding:clamp(14px,2vh,22px) 0;border-top:1px solid var(--line-d)}
.nsteps .k{font-size:var(--t-meta)}
.nsteps .v{font-size:var(--t-h3);letter-spacing:-.015em}
.nx-r{display:flex;flex-direction:column;gap:clamp(12px,1.2vw,20px)}
.startcard{position:relative;flex:1;border-radius:24px;background:var(--metal);color:#111;padding:clamp(22px,2.4vw,40px);display:flex;flex-direction:column;justify-content:space-between;gap:20px;overflow:hidden;min-height:240px}
.startcard::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--sx,70%) var(--sy,20%),rgba(255,255,255,.7),transparent 45%);mix-blend-mode:soft-light;pointer-events:none}
.startcard .k{color:#3a3a38}
.startcard .date{font-size:clamp(36px,3.6vw,64px);font-weight:400;letter-spacing:-.05em;line-height:1}
.startcard .avail{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:var(--on-ink);font-size:var(--t-meta);font-weight:600;text-transform:uppercase;letter-spacing:.03em;padding:9px 16px;border-radius:var(--r-pill)}
.startcard .avail i{width:8px;height:8px;border-radius:50%;background:var(--yg)}
.cta{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--yg);color:var(--ink);border-radius:var(--r-card);padding:clamp(18px,1.8vw,28px);font-size:var(--t-h3);font-weight:500;letter-spacing:-.02em;text-align:left;width:100%;transition:background var(--d2),color var(--d2)}
.cta .ar{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--lime);display:grid;place-items:center;flex:none;transition:transform .6s var(--spring)}
.cta:hover{background:var(--paper)} .cta:hover .ar{transform:rotate(-45deg)}
@media (max-width:860px){.nx{grid-template-columns:1fr}}

/* approval dialog */
.modal{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:16px;background:rgba(19,19,19,.6);opacity:0;pointer-events:none;transition:opacity var(--d2)}
.modal.open{opacity:1;pointer-events:auto}
.modal .box{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:24px;padding:clamp(22px,3vw,40px);display:grid;gap:18px;transform:translateY(16px);transition:transform var(--d2) var(--ease)}
.modal.open .box{transform:none}
.modal h3{font-size:var(--t-label);font-weight:450;text-transform:uppercase;letter-spacing:-.025em}
.modal .sumrow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:var(--t-small)}
.modal textarea{width:100%;min-height:150px;font:inherit;font-size:var(--t-small);padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--white);color:var(--ink);resize:vertical}
.modal .acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:var(--r-pill);font-size:var(--t-small);font-weight:500;background:var(--ink);color:var(--on-ink);text-decoration:none}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--ink)}
.btn:hover{background:var(--yg);color:var(--ink)}
.modal .fine{font-size:var(--t-meta);color:var(--mute)}

/* ── 15 closing: the studio's own imagery, scattered and draggable ── */
.closing{justify-content:flex-end;gap:clamp(24px,3vw,44px)}
.closing h2{font-size:var(--t-display);font-weight:430;letter-spacing:-.03em;line-height:1.05;text-transform:uppercase;max-width:26ch}
.closing h2 span{color:var(--mute-d)}
.board{position:relative;flex:1 1 auto;min-height:clamp(340px,46vh,560px);margin-inline:calc(var(--g) * -1);overflow:hidden;touch-action:pan-y}
.board .hint{position:absolute;left:var(--g);bottom:0;font-size:var(--t-meta);color:var(--mute-d);display:flex;gap:8px;align-items:center}
.board .hint button{color:var(--on-ink);text-decoration:underline;text-underline-offset:3px}
.card{position:absolute;width:clamp(110px,12vw,220px);aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:var(--card);box-shadow:0 18px 40px rgba(0,0,0,.35);
  cursor:grab;user-select:none;-webkit-user-select:none;transition:transform .7s var(--spring),box-shadow var(--d2)}
.card img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.card:hover{box-shadow:0 30px 60px rgba(0,0,0,.5)}
.card.drag{cursor:grabbing;transition:box-shadow var(--d2);box-shadow:0 40px 80px rgba(0,0,0,.55)}
.card.metal{background:var(--metal);display:grid;place-items:center}
.card.metal svg{width:22%;fill:#151515}
.card.metal::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,30%) var(--my,20%),rgba(255,255,255,.75),transparent 45%);mix-blend-mode:soft-light}
.card.story{background:#E9E9E5;color:#1a1a1a;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:16% 0;font-weight:600;font-size:clamp(14px,1.4vw,24px);letter-spacing:.02em}
.card.story::before{content:"";position:absolute;inset:20% 10%;background:radial-gradient(circle,#FDF451 0%,rgba(253,244,81,0) 66%);filter:blur(6px)}
.card.story span{position:relative}
.card.story .dots{position:relative;display:flex;gap:7%;width:84%;justify-content:center}
.card.story .dots i{width:6px;height:6px;border-radius:50%;background:#151515;flex:none}
.contacts .v{font-size:var(--t-small);line-height:1.7}
.contacts a{text-decoration:none;border-bottom:1px solid transparent;transition:border-color var(--d2)}
.contacts a:hover{border-color:currentColor}
.copy{margin-left:8px;font-size:11px;color:var(--mute-d);border:1px solid var(--line-d);border-radius:var(--r-pill);padding:2px 9px;vertical-align:2px}
.copy:hover{background:var(--on-ink);color:var(--ink)}
@media (max-width:760px){
  .board{min-height:0;display:flex;gap:12px;overflow-x:auto;padding:16px var(--g) 40px;scroll-snap-type:x mandatory;touch-action:auto}
  .card{position:relative;flex:0 0 42vw;transform:none!important;left:auto!important;top:auto!important;scroll-snap-align:start;cursor:default}
  .board .hint button{display:none}
}

/* ── appendix ── */
.appx{min-height:auto;justify-content:flex-start}
.caps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
.caps h4{font-size:var(--t-small);font-weight:500;margin-bottom:8px;color:var(--on-ink)}
.caps li{font-size:var(--t-small);color:var(--mute-d);padding:6px 0;border-top:1px solid var(--line-d)}
@media (max-width:760px){.caps{grid-template-columns:1fr}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01s!important;scroll-behavior:auto!important}}


/* ════ Reference presentation system (Monoscape style), in Heli colors ════
   Light grey slides on a white page, a small eyebrow with an arrow, a sentence case title on the content column,
   small grey body copy, a running footer on every slide, square corners, full bleed images, lime highlight and squares. */
:root{
  --paper:#F1F1F0; --card:#E6E6E4; --card-2:#DCDCD9; --line:#D6D6D2; --line-d:#D6D6D2; --mute-d:#8C8C86; --text-2:#77776F;
  --r-card:0px; --col:minmax(0,1fr) minmax(0,2.9fr);
  --ff:"cv03" on,"cv04" on,"cv09" on,"cv11" on;
  --t-body:clamp(15px,1.05vw,18px); --t-small:clamp(13px,.88vw,15px); --t-meta:12px;
  --t-h3:clamp(17px,1.25vw,22px); --t-label:clamp(20px,1.6vw,30px); --t-h2:clamp(28px,2.6vw,50px); --t-display:clamp(40px,4.2vw,84px);
  --pad-top:clamp(56px,7.5vh,84px); --pad-bot:20px;
}
body{background:#fff;color:var(--ink);font-feature-settings:var(--ff);letter-spacing:-.011em}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;background:#fff}
.s.light,.s.dark,.tl{background:var(--paper);color:var(--ink)}
.s{justify-content:flex-start;gap:clamp(28px,3.6vw,60px)}
.c-tl,.c-bl,.c-br{display:none}
.progress{height:1px;background:var(--ink)}
.loader,.js .loader{background:var(--paper);color:var(--ink)}

/* type */
h1,h2,h3,.lead,.nx-t{text-transform:none!important;font-weight:450!important;letter-spacing:-.035em!important}
.lead,.ch-grid .lead,.nx-t,.closing h2,.sh h2{line-height:1.08}
.grey,.lead .grey,.dark .lead .grey,.cover h1 .grey,.closing h2 span{color:var(--mute)!important;font-style:normal}
.hl{background:var(--yg);color:inherit;padding:0 .06em;margin:0 -.02em}
.sq{display:inline-block;width:.16em;height:.16em;background:var(--yg);vertical-align:top;margin:.08em 0 0 .12em}
.sqb{display:block;width:clamp(28px,2.4vw,44px);aspect-ratio:1;background:var(--yg)}
.body,.dark .body{font-size:var(--t-small);color:var(--text-2);line-height:1.55}
.k,.dark .k{color:var(--mute);text-transform:none;letter-spacing:0;font-size:var(--t-meta)}

/* slide header: eyebrow on the left column, title and note on the content column */
.sh{grid-template-columns:var(--col);align-items:start;gap:clamp(16px,2vw,40px)}
.eyebrow{font-size:13px;font-weight:500;padding-top:.5em;white-space:nowrap}
.eyebrow span{margin-left:4px}
.sh-m{display:grid;gap:clamp(10px,1.2vw,18px);justify-items:start}
.sh h2{font-size:var(--t-h2);max-width:20ch}
.sh .q,.dark .sh .q{justify-self:start;text-align:left;font-size:var(--t-small);color:var(--text-2);max-width:56ch}
@media (max-width:700px){.sh{grid-template-columns:1fr}.eyebrow{padding-top:0}}

/* running footer on every slide */
.sf{margin-top:auto;display:grid;grid-template-columns:var(--col);grid-template-columns:minmax(0,1fr) auto auto minmax(0,1fr) auto auto;gap:0 clamp(16px,2.4vw,44px);align-items:baseline;
  font-size:12px;color:var(--mute);padding-top:clamp(18px,3vh,32px)}
.sf b{font-weight:500;color:var(--ink)}
.sf .sf-st{grid-column:5;color:var(--text-2)}
.sf .pg{grid-column:6;text-align:right}
@media (max-width:860px){.sf{grid-template-columns:1fr auto}.sf span:not(.pg){display:none}.sf .pg{grid-column:2}}

/* section navigator: quiet vertical dots on the right edge */
.perf-nav{left:auto;right:14px;top:50%;bottom:auto;transform:translateY(-50%);flex-direction:column;padding:8px 6px;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;gap:8px}
.perf-nav button{width:5px;height:5px;background:#BDBDB8}
.perf-nav button.on{background:var(--ink);transform:scale(1.5)}
.perf-nav button:hover{background:var(--ink)}
.perf-nav i{width:9px;height:1px;margin:2px 0}
.perf-nav .tip{left:auto!important;right:calc(100% + 10px);bottom:auto;background:var(--ink);color:var(--on-ink);transform:translateX(4px)}
.perf-nav .tip.show{transform:none}

/* cover: full bleed film band, then descriptor beside the wordmark */
.cover{padding-top:0;gap:clamp(28px,5vh,64px)}
.cover .film{flex:0 0 auto;height:clamp(240px,46vh,520px);margin:0 calc(var(--g) * -1);border-radius:0}
.cover .deck{color:#fff;mix-blend-mode:difference;z-index:2}
.cv-row{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:clamp(24px,5vw,96px);flex-wrap:wrap}
.cv-desc{max-width:30ch;font-size:var(--t-small);color:var(--text-2);line-height:1.45}
.cv-desc b{display:block;color:var(--ink);font-weight:500;margin-bottom:6px}
.cover h1{font-size:var(--t-display);line-height:1;letter-spacing:-.045em!important;font-weight:450!important}
.cover .meta div{border-color:var(--line);padding-top:12px}
.cover .meta p:last-child{font-size:var(--t-small)}

/* lists and blocks */
.obj{grid-template-columns:1fr}
.obj li{grid-template-columns:clamp(28px,2.4vw,44px) minmax(0,1fr) 3em minmax(0,1.5fr);gap:clamp(14px,2vw,36px);align-items:start;padding:clamp(14px,2.2vh,24px) 0}
.obj li h3{padding-top:.1em}
.obj .no{font-size:var(--t-small);color:var(--ink);padding-top:.35em}
.obj p{grid-column:auto;padding-top:.3em}
@media (max-width:700px){.obj li{grid-template-columns:28px minmax(0,1fr)}.obj .no{display:none}.obj p{grid-column:2}}
.persp .cols h3{color:var(--ink)} .persp .cols p.t{color:var(--text-2)}
.pills{height:clamp(180px,30vh,340px);margin:0 calc(var(--g) * -1);gap:4px}
.pill,.pill.on{border-radius:0}
.facts>div{background:#fff;color:var(--ink)} .facts .k{color:var(--mute)} .facts .v small{color:var(--mute)}
.facts .v,.creds .n{font-weight:400;letter-spacing:-.045em}
.facts>div:not(.accent) .v::after{content:"";display:inline-block;width:.18em;height:.18em;background:var(--yg);vertical-align:top;margin-left:.1em}
.sol .svc{background:#fff;color:var(--ink)} .sol .svc p{color:var(--text-2)}
.case .frame,.drawer .frame{border-radius:0}
.strip a{border-radius:0}
.tabs{background:var(--card)} .tabs button[aria-selected="true"]{background:#fff;color:var(--ink)}

/* process: white card for the open phase */
.ph{background:var(--card)} .ph.on{background:#fff;color:var(--ink)}
.ph.on .wk,.ph-body .purpose,.ph-body .dt{color:var(--mute)}
.ph-art .sheet{fill:#fff}

/* timeline */
.bar.done{background:var(--yg);color:var(--ink)}
.grid-box{border-radius:0;background:#fff}
.wk-head button:hover{background:var(--paper)}

/* investment: chosen ticket turns white, the stub turns lime */
.pkg .tk{background:var(--card)}
.pkg[aria-pressed="true"] .tk{background:#fff;color:var(--ink)}
.pkg[aria-pressed="true"] .stub{background:var(--yg);color:var(--ink)}
.pkg[aria-pressed="true"] .tk-h p,.pkg[aria-pressed="true"] li.sub{color:var(--text-2)}
.pkg[aria-pressed="true"] .check{border-color:var(--ink)}
.t-main{background:#fff;color:var(--ink)} .t-main .k,.total .note{color:var(--mute)}
.total .row{border-color:var(--line)}
.total .row.credit b{color:var(--ink);background:var(--yg);padding:0 .2em}
.total .msg{color:var(--ink)}
.t-perf{background:radial-gradient(circle,var(--paper) 3.5px,transparent 4px) 0 50%/22px 24px repeat-x,linear-gradient(180deg,#fff 50%,var(--lime) 50%)}
.t-main::after{background:none}

/* next steps */
.nsteps li{border-color:var(--line)}
.startcard{border-radius:0}

/* closing: image band on top, brand on the left column, statement on the content column */
.closing{gap:clamp(24px,3.4vw,52px)}
.card{border-radius:4px;box-shadow:0 14px 34px rgba(0,0,0,.14)}
.card:hover{box-shadow:0 22px 46px rgba(0,0,0,.2)}
.card.drag{box-shadow:0 30px 60px rgba(0,0,0,.25)}
.board .hint button{color:var(--ink)}
.cl-row{display:grid;grid-template-columns:var(--col);gap:clamp(16px,2vw,40px);align-items:start}
.cl-brand{font-size:13px;font-weight:500;letter-spacing:.02em;text-transform:uppercase;padding-top:.6em}
.closing h2{font-size:var(--t-h2);max-width:22ch}
.copy{border-color:var(--line);color:var(--mute)} .copy:hover{background:var(--ink);color:#fff}
@media (max-width:700px){.cl-row{grid-template-columns:1fr}}

/* appendix */
.caps h4{color:var(--ink)} .caps li{color:var(--text-2);border-color:var(--line)}
.more,.dark .more{border-color:var(--line)}
.tabs{align-self:flex-start}
.facts>div:not(.accent) .v::after{content:none}
.pkg[aria-pressed="true"] .stub{background:#fff;color:var(--ink)}
.total .row.credit b{background:none}
.total .row.credit b:last-child{background:var(--yg)}
.pills{height:clamp(160px,24vh,280px)}
.tl .stick{padding-bottom:16px;gap:clamp(20px,2.6vh,40px)}
.bar,.wk-head button,.bub{text-transform:none;letter-spacing:-.01em}
.bub small{color:var(--text-2)}

/* round 2: soft corners, no outlined dots, titles anchored left */
:root{--r-card:12px}
.tbc::before{box-shadow:none!important;background:var(--yg)}
.pill,.pill.on,.case .frame,.drawer .frame,.strip a,.grid-box,.startcard{border-radius:var(--r-card)}
.card{border-radius:10px}
.sqb{border-radius:4px} .sq{border-radius:2px} .hl{border-radius:4px}
.ph,.pkg .tk,.pkg .stub,.facts>div,.sol .svc,.cta{border-radius:var(--r-card)}
.t-main{border-radius:var(--r-card) var(--r-card) 0 0} .t-stub{border-radius:0 0 var(--r-card) var(--r-card)}
.pills{margin:0;gap:8px}
.sh{grid-template-columns:1fr;gap:clamp(10px,1.4vw,20px)}
.eyebrow{padding-top:0}
.sh-m{justify-items:start}
.cl-row{grid-template-columns:1fr;gap:12px}
.cl-brand{padding-top:0}
.cv-row{justify-content:flex-start}

/* round 3: timeline sits on lines, no box; progress fills in ink */
.grid-box{border:0;border-radius:0;background:none;overflow:visible}
.wk-head{border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.wk-head button{border-left:0}
.wk-head button:hover{background:none;color:var(--ink)}
.rows{background:repeating-linear-gradient(90deg,transparent 0 calc(100% / var(--w) - 1px),var(--line) calc(100% / var(--w) - 1px) calc(100% / var(--w)));border-bottom:1px solid var(--line)}
.bar::before{background:var(--ink)}
.bar span{color:#fff;mix-blend-mode:difference}
.bar.done{background:var(--ink);color:#fff}
.chart.static .bar span{color:var(--ink);mix-blend-mode:normal}
.rows{clip-path:inset(-20px 1px -1px 0)}

/* round 4: the total ticket tears through the middle of the perforation */
.t-perf{height:12px;background:
  radial-gradient(circle at 50% 100%,var(--paper) 3.5px,transparent 4px) 0 0/22px 12px repeat-x,
  radial-gradient(circle at 0 100%,var(--paper) 12px,transparent 12.5px) no-repeat,
  radial-gradient(circle at 100% 100%,var(--paper) 12px,transparent 12.5px) no-repeat,#fff}
.t-perf::before,.t-perf::after{content:none}
.t-stub{background:
  radial-gradient(circle at 50% 0,var(--paper) 3.5px,transparent 4px) 0 0/22px 12px repeat-x,
  radial-gradient(circle at 0 0,var(--paper) 12px,transparent 12.5px) no-repeat,
  radial-gradient(circle at 100% 0,var(--paper) 12px,transparent 12.5px) no-repeat,var(--yg);
  padding-top:calc(clamp(18px,2vw,28px) + 12px)}

/* round 5: first, thank you and last slides in full black */
.s.ink{background:var(--ink);color:var(--on-ink);--line:#333331;--text-2:#A3A39C;--mute:#7E7E78}
.s.ink .sf b,.s.ink .cv-desc b,.s.ink .caps h4,.s.ink .board .hint button,.s.ink .contacts a{color:var(--on-ink)}
.s.ink .hl{color:var(--ink)}
.s.ink .copy{border-color:#444;color:#A3A39C} .s.ink .copy:hover{background:var(--on-ink);color:var(--ink)}
.s.ink .more>summary:hover .pm{background:var(--on-ink);color:var(--ink)}
.s.ink .card{box-shadow:0 18px 40px rgba(0,0,0,.5)}
.s.ink .tbc{color:#A3A39C}
.s.ink.cover{background:#000}

/* round 6: capital section titles with a small black dot, highlighter sweep on hover; squares become dots */
.sh h2{text-transform:uppercase!important;letter-spacing:-.02em!important;
  background:linear-gradient(var(--lime),var(--lime)) no-repeat 0 55%/0% 78%;padding:0 .12em;margin-left:-.12em;
  transition:background-size .55s var(--ease),transform .9s var(--spring)}
.sh h2::before{content:"";display:inline-block;width:.2em;height:.2em;border-radius:50%;background:currentColor;vertical-align:.32em;margin-right:.32em}
.sh h2:hover{background-size:100% 78%}
.obj h3{justify-self:start;background:linear-gradient(var(--lime),var(--lime)) no-repeat 0 60%/0% 70%;padding:0 .1em;margin-left:-.1em;transition:background-size .5s var(--ease)}
.obj li:hover h3{background-size:100% 70%}
.sqb{width:10px;height:10px;aspect-ratio:auto;border-radius:50%;background:var(--ink);margin-top:.55em}
.obj li{grid-template-columns:10px minmax(0,1fr) 3em minmax(0,1.5fr)}
.sq,.s.ink .sq{width:.14em;height:.14em;border-radius:50%;background:currentColor}
@media (prefers-reduced-motion:reduce){.sh h2,.obj h3{transition:none}}
.sh h2::before{content:none}

/* challenge: label column, large statement, detail pinned to the bottom */
.ch2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);gap:clamp(24px,4vw,80px);align-items:stretch}
.ch2 .lead{font-size:var(--t-h2);max-width:12ch}
.ch-main{display:flex;flex-direction:column;gap:clamp(32px,6vh,80px)}
.ch-big{font-size:clamp(20px,1.75vw,32px);line-height:1.28;letter-spacing:-.025em;max-width:34ch;text-wrap:pretty}
.ch-sub{margin-top:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,3vw,56px);align-items:start}
.ch-sub .body{max-width:46ch}
@media (max-width:860px){.ch2,.ch-sub{grid-template-columns:1fr}}

/* cover: small horse film sitting above the project description, same width */
.cover{padding-top:var(--pad-top)}
.cv-row{align-items:flex-end}
.cv-l{width:min(280px,100%);display:grid;gap:16px}
.cv-desc{max-width:none}
.cover .film{flex:none;width:100%;height:auto;aspect-ratio:4/3;margin:0;border-radius:10px;min-height:0}
.cover .film video{object-fit:cover;object-position:78% 50%}
.sf .sf-st,.sf .pg{color:var(--text-2);font-size:12px;font-weight:400;font-variant-numeric:normal;letter-spacing:-.011em}
.confirm h3{font-size:clamp(14px,1vw,17px);color:var(--text-2);margin-bottom:10px}
.confirm li{font-size:clamp(17px,1.3vw,23px);letter-spacing:-.02em;padding:clamp(12px,1.6vh,18px) 0}
.confirm li .tbc{font-size:clamp(13px,.9vw,15px);letter-spacing:0}
.ch-sub .body{font-size:clamp(15px,1.05vw,18px)}
.ch-sub{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.confirm li{font-size:clamp(16px,1.15vw,20px);padding:clamp(10px,1.3vh,15px) 0}
.ch-main{gap:clamp(28px,4.5vh,64px)}

/* perspective images back to the Heli capsule shape */
.pill,.pill.on{border-radius:999px}
.pills{height:clamp(120px,15vh,190px);gap:clamp(8px,1vw,16px)}
.sol .svc{border-radius:999px;padding:clamp(16px,1.6vw,24px) clamp(26px,2.6vw,44px)}
.sol .k{display:inline-block;background:var(--yg);color:var(--ink);font-weight:600;font-size:12px;padding:4px 11px;border-radius:999px;margin-bottom:10px}

/* round 7: larger body copy everywhere for readability */
:root{--t-small:clamp(15px,1.06vw,18px);--t-body:clamp(16px,1.18vw,20px);--t-meta:13px}
.body,.dark .body,.sh .q,.dark .sh .q,.cv-desc,.persp .cols p.t,.obj p,.sol .need,.sol .out,.sol .svc p{font-size:var(--t-small);line-height:1.55}
.sf,.sf .sf-st,.sf .pg{font-size:13px}
.eyebrow{font-size:14px}
.bar{font-size:14px} .bub{font-size:13px}
.ph-body .purpose,.ph-body .dl{font-size:var(--t-small)}
.total .row,.total .note,.pkg li{font-size:var(--t-small)}
.acc{height:clamp(360px,48vh,480px)}

/* round 8: one more step up for body copy */
:root{--t-small:clamp(17px,1.2vw,20px);--t-body:clamp(18px,1.3vw,22px);--t-meta:14px}
.sf,.sf .sf-st,.sf .pg{font-size:14px}
.eyebrow{font-size:15px}
.bar{font-size:15px} .bub{font-size:14px}
.ch-sub .body{font-size:var(--t-small)}
.confirm li{font-size:clamp(18px,1.3vw,22px)} .confirm h3{font-size:clamp(15px,1.06vw,18px)} .confirm li .tbc{font-size:clamp(14px,1vw,16px)}
.sol .k{font-size:13px}
.ch-sub{grid-template-columns:minmax(0,1fr) minmax(0,1.9fr)}
.sol-head{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1.1fr) 40px minmax(0,1fr);gap:12px;margin-bottom:calc(clamp(28px,3.6vw,60px) * -1 + 14px)}
.sol-head .k{justify-self:start;display:inline-block;background:var(--yg);color:var(--ink);font-weight:600;font-size:13px;padding:4px 11px;border-radius:999px}
@media (max-width:860px){.sol-head{display:none}}

/* proposed solution: no white boxes; editorial rows with a big service name and drawn connectors */
.sol li,.sol-head{grid-template-columns:minmax(0,1fr) 72px minmax(0,1.2fr) 72px minmax(0,1fr);gap:clamp(12px,1.6vw,28px)}
.sol li{padding:clamp(24px,4vh,44px) 0}
.sol .svc,.sol li.off .svc{background:none;padding:0;border-radius:0;color:var(--ink)}
.sol .svc h3{display:inline;font-size:clamp(26px,2.3vw,42px);line-height:1.1;letter-spacing:-.035em;
  background:linear-gradient(var(--lime),var(--lime)) no-repeat 0 62%/0% 62%;transition:background-size .55s var(--ease)}
.sol li:hover .svc h3{background-size:100% 62%}
.sol .svc p{margin-top:12px;color:var(--text-2)}
.sol .arrow{font-size:0;align-self:center;height:1px;background:var(--ink);position:relative;transform-origin:left;transform:scaleX(.45);transition:transform .6s var(--ease)}
.sol .arrow::after{content:"";position:absolute;right:0;top:-4px;width:9px;height:9px;border-top:1px solid var(--ink);border-right:1px solid var(--ink);transform:rotate(45deg);transform-origin:center}
.sol .arrow{text-align:left;width:auto}
.sol li:hover .arrow{transform:scaleX(1)}
.sol li.off .svc h3{color:var(--mute)}
@media (max-width:860px){.sol li{grid-template-columns:1fr}.sol .arrow{display:none}}
.sol .arrow{transform:none!important;justify-self:start;width:55%;transition:width .6s var(--ease)}
.sol li:hover .arrow{width:100%}
.sol .k{display:table;margin-bottom:12px}
.creds .n .tbc{font-size:var(--t-small);letter-spacing:0;line-height:1.5}

/* plus and close marks drawn in CSS so they sit exactly in the circle's centre */
.more>summary .pm,.drawer .x{position:relative;font-size:0;line-height:0}
.more>summary .pm::before,.more>summary .pm::after,.drawer .x::before,.drawer .x::after{content:"";position:absolute;left:50%;top:50%;width:11px;height:1.5px;background:currentColor;border-radius:1px;transform:translate(-50%,-50%)}
.more>summary .pm::after{transform:translate(-50%,-50%) rotate(90deg)}
.drawer .x::before,.drawer .x::after{width:15px}
.drawer .x::before{transform:translate(-50%,-50%) rotate(45deg)}
.drawer .x::after{transform:translate(-50%,-50%) rotate(-45deg)}
.proj{display:grid;gap:14px}
.proj-h{font-size:var(--t-small);font-weight:500;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.proj-h span{display:inline-block;background:var(--yg);font-weight:600;font-size:13px;padding:4px 11px;border-radius:999px}
.creds .n small{display:block;font-size:var(--t-meta);letter-spacing:0;color:var(--text-2);margin-top:8px}
.strip{grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.strip a{font-size:14px;padding:14px;border-radius:12px}
@media (max-width:860px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* Identity & Messaging glyph: a speech bubble whose lines get written, with a blinking cursor */

/* how we start: big title, pill-numbered steps, start card and two call-to-action buttons, validity line */
.hnx{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-areas:"s r" "c c" "f f";gap:clamp(24px,3vw,56px) clamp(28px,4vw,72px);align-content:start}
.hnx-steps{grid-area:s;align-self:start;border-top:1px solid var(--line)}

.hnx-start{background:#F7F7F7;border-radius:24px;padding:clamp(22px,2.2vw,34px) clamp(24px,2.4vw,40px);display:grid;gap:8px}
.hnx-date{font-size:var(--hs-h2);font-weight:500;letter-spacing:-.04em;line-height:1.4}
.hnx-avail{display:flex;align-items:center;gap:10px;font-size:var(--t-small);color:var(--text-2)}
.hnx-avail i{width:9px;height:9px;border-radius:50%;background:var(--yg)}
.hnx-cta{display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;text-align:left;border-radius:24px;padding:clamp(14px,1.4vw,20px) clamp(14px,1.2vw,18px) clamp(14px,1.4vw,20px) clamp(22px,2.2vw,34px);background:#F7F7F7;color:var(--ink);transition:transform .5s var(--spring),filter .2s}
.hnx-cta.go{background:linear-gradient(90deg,#FFFBE0 0%,#FEF7A6 45%,#FDF04A 100%)}
.hnx-cta:hover{transform:translateY(-2px)}
.hnx-cta>span{display:grid;gap:4px}
.hnx-cta b{font-size:var(--t-h3);font-weight:500;letter-spacing:-.04em}
.hnx-cta em{font-style:normal;font-size:var(--t-small);color:var(--text-2)}

.hnx-cta.go i{background:var(--ink)}
.hnx-cta i svg{width:38%;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hnx-cta.go i svg{stroke:#fff}
.hnx-cta:hover i{transform:rotate(45deg)}
.hnx-foot{grid-area:f;display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;padding-top:clamp(18px,2.4vh,28px);border-top:1px solid var(--line);font-size:var(--t-small)}

  const y=innerHeight*.45;let idx=0;secs.forEach((s,i)=>{if(s.getBoundingClientRect().top<=y)idx=i});setCurrent(idx);
  document.body.classList.toggle('on-ink',secs[idx].classList.contains('ink'));
  const h=document.documentElement.scrollHeight-innerHeight;$('#progress').style.transform=`scaleX(${h>0?scrollY/h:0})`;
  if(!RM)$('#mark').style.transform=`rotate(${scrollY*.12}deg)`;})}
addEventListener('scroll',onScroll,{passive:true});addEventListener('resize',onScroll);
addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[role=dialog]')||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){secs[clamp(cur+(e.key==='ArrowRight'?1:-1),0,secs.length-1)].scrollIntoView({behavior:RM?'auto':'smooth'});e.preventDefault()}});

/* ── small details ── */
if(FINE&&!RM) secs.forEach(sec=>{const els=$$('.sh h2',sec);if(!els.length)return;
  sec.addEventListener('pointermove',e=>els.forEach(el=>{const r=el.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),k=clamp(1-Math.hypot(dx,dy)/(r.width*.6+180),0,1);
    el.classList.add('pull');el.style.transform=k?`translate(${dx*.08*k}px,${dy*.08*k}px)`:''}));
  sec.addEventListener('pointerleave',()=>els.forEach(el=>{el.classList.remove('pull');el.style.transform=''}))});
const pills=$$('.pill');pills.forEach(p=>p.addEventListener('pointerenter',()=>pills.forEach(q=>q.classList.toggle('on',q===p))));
$$('.copy').forEach(b=>b.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent='Copied'}catch{b.textContent=b.dataset.copy}setTimeout(()=>b.textContent='Copy',1600)}));

/* ── closing board: scatter, drag, shuffle ── */
const board=$('#board'), cards=$$('.card',board); let z=10;
const place=(c,x,y,r)=>{c.style.left=x+'%';c.style.top=y+'%';c.dataset.rot=r;c.style.transform=`rotate(${r}deg)`};
cards.forEach(c=>place(c,+c.dataset.x,+c.dataset.y,+c.dataset.r));
const deskBoard=()=>matchMedia('(min-width: 761px)').matches;
cards.forEach(c=>{
  c.addEventListener('pointerenter',()=>{if(!c.classList.contains('drag')&&deskBoard()&&!RM)c.style.transform='rotate(0deg) translateY(-14px) scale(1.04)'});
  c.addEventListener('pointerleave',()=>{if(!c.classList.contains('drag')&&deskBoard())c.style.transform=`rotate(${c.dataset.rot}deg)`});
  c.addEventListener('pointerdown',e=>{if(!deskBoard()||e.pointerType==='touch')return;e.preventDefault();c.setPointerCapture(e.pointerId);c.classList.add('drag');c.style.zIndex=++z;
    const br=board.getBoundingClientRect(),sx=e.clientX,sy=e.clientY,ox=c.offsetLeft,oy=c.offsetTop;let vx=0,lx=sx;
    const mv=ev=>{const nx=clamp(ox+ev.clientX-sx,-40,br.width-c.offsetWidth+40),ny=clamp(oy+ev.clientY-sy,-40,br.height-c.offsetHeight+40);vx=ev.clientX-lx;lx=ev.clientX;
      c.style.left=nx/br.width*100+'%';c.style.top=ny/br.height*100+'%';c.style.transform=`rotate(${clamp(vx*.8,-12,12)}deg) scale(1.06)`};
    const up=()=>{c.classList.remove('drag');const r=clamp(vx*1.4,-10,10)||(+c.dataset.rot);c.dataset.rot=r.toFixed(1);c.style.transform=`rotate(${r}deg)`;
      c.removeEventListener('pointermove',mv);c.removeEventListener('pointerup',up);c.removeEventListener('pointercancel',up)};
    c.addEventListener('pointermove',mv);c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up)});
});
$('#shuffle').addEventListener('click',()=>cards.forEach((c,i)=>setTimeout(()=>{c.style.zIndex=++z;place(c,2+Math.random()*84,2+Math.random()*40,(Math.random()-.5)*16)},i*45)));
const metal=$('.card.metal');
if(FINE&&!RM){
  board.addEventListener('pointermove',e=>{const r=metal.getBoundingClientRect();metal.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');metal.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%')});
  const tt=$('#totTicket');
  tt.addEventListener('pointermove',e=>{const r=tt.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;tt.classList.add('live');
    tt.style.setProperty('--ry',((x-.5)*8)+'deg');tt.style.setProperty('--rx',((.5-y)*6)+'deg');const m=$('.t-main',tt).getBoundingClientRect();
    tt.style.setProperty('--sx',((e.clientX-m.left)/m.width*100)+'%');tt.style.setProperty('--sy',((e.clientY-m.top)/m.height*100)+'%')});
  tt.addEventListener('pointerleave',()=>{tt.classList.remove('live');tt.style.setProperty('--rx','0deg');tt.style.setProperty('--ry','0deg')});
  const sc=$('.startcard');if(sc)$('#next').addEventListener('pointermove',e=>{const r=sc.getBoundingClientRect();sc.style.setProperty('--sx',clamp((e.clientX-r.left)/r.width*100,-20,120)+'%');sc.style.setProperty('--sy',clamp((e.clientY-r.top)/r.height*100,-20,120)+'%')});
}
/* total ticket: hover peels the stub at its free corner, a drag tears it along the perforation,
   past the threshold it snaps off and hangs, otherwise it springs back; click a torn stub to reattach it */
{ const tt=$('#totTicket'), st=tt&&$('.t-stub',tt), mn=tt&&$('.t-main',tt);
  if(st){ const hint=document.createElement('span'); hint.className='t-hint'; hint.setAttribute('aria-hidden','true'); hint.textContent='Pull to tear'; st.prepend(hint);
    const s={a:0,va:0,y:0,vy:0,ta:0,ty:0}; let raf=0, drag=null, torn=false, hover=false, lastHole=0;
    const put=()=>{ const j=drag?Math.sin(performance.now()/38)*.12*Math.min(1,s.a/4):0;
      st.style.setProperty('--tear',`translateY(${s.y.toFixed(2)}px) rotate(${(-s.a-j).toFixed(3)}deg)`);
      mn.style.setProperty('--tear-main',`translateY(${(-Math.min(s.a,10)*.25).toFixed(2)}px)`); };
    const tick=()=>{ if(!drag){ s.va+=(s.ta-s.a)*.09; s.va*=.82; s.a+=s.va; s.vy+=(s.ty-s.y)*.09; s.vy*=.82; s.y+=s.vy; }
      put(); const busy=drag||Math.abs(s.va)>.005||Math.abs(s.ta-s.a)>.01||Math.abs(s.vy)>.01||Math.abs(s.ty-s.y)>.02;
      raf=busy?requestAnimationFrame(tick):0; };
    const kick=()=>{ if(RM){s.a=s.ta;s.y=s.ty;put();return} if(!raf)raf=requestAnimationFrame(tick) };
    const rest=()=>{ s.ta=torn?9:(hover?2.2:0); s.ty=torn?26:(hover?2:0); hint.textContent=torn?(TOUCH?'Tap to put back':'Click to put back'):(TOUCH?'Pull down or tap to tear':'Pull to tear'); kick(); };
    tt.addEventListener('pointerenter',()=>{hover=true;if(!drag)rest()}); tt.addEventListener('pointerleave',()=>{hover=false;if(!drag)rest()});
    st.addEventListener('pointerdown',e=>{ if(torn)return; e.preventDefault(); moved=false; st.setPointerCapture(e.pointerId); st.classList.add('drag');
      drag={x:e.clientX,y:e.clientY,a:s.a}; lastHole=0; kick(); });
    st.addEventListener('pointermove',e=>{ if(!drag)return; const dx=e.clientX-drag.x, dy=Math.max(0,e.clientY-drag.y);
      const a=Math.min(14,drag.a+dy*.11-dx*.015), y=Math.min(30,dy*.22);
      s.va=a-s.a; s.vy=y-s.y; s.a=a; s.y=y;
      const hole=Math.floor(a/1.6); if(hole>lastHole&&navigator.vibrate){try{navigator.vibrate(4)}catch{}} lastHole=Math.max(lastHole,hole); });
    let moved=false;
    const end=()=>{ if(!drag)return; st.classList.remove('drag'); moved=s.a-drag.a>.5; drag=null; torn=s.a>8.5; if(torn)s.va+=1.2; rest(); setTimeout(()=>moved=false,0); };
    st.addEventListener('pointerup',end); st.addEventListener('pointercancel',end);
    st.addEventListener('click',()=>{ if(drag||moved)return; if(torn){ torn=false; s.va-=.8; } else if(TOUCH){ torn=true; s.va+=1.2; } rest(); });
    rest(); } }
/* challenge headline: letters gain weight near the cursor */
const wt=$('#weightTitle');
if(wt&&FINE&&!RM){const words=wt.textContent.split(' ');wt.textContent='';
  words.forEach((w,wi)=>{const ws=document.createElement('span');ws.style.whiteSpace='nowrap';ws.setAttribute('aria-hidden','true');
    [...w].forEach(ch=>{const sp=document.createElement('span');sp.textContent=ch;ws.appendChild(sp)});wt.appendChild(ws);if(wi<words.length-1)wt.appendChild(document.createTextNode(' '))});
  const letters=$$('span span',wt),sec=$('#challenge');
  sec.addEventListener('pointermove',e=>letters.forEach(l=>{const r=l.getBoundingClientRect(),d=Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2)),k=clamp(1-d/300,0,1);l.style.fontWeight=Math.round(500+k*350-(1-k)*120)}));
  sec.addEventListener('pointerleave',()=>letters.forEach(l=>l.style.fontWeight=''));}
/* intro counter */
if(!RM){const lp=$('#lpct'),t0=performance.now();const tk=n=>{const q=clamp((n-t0)/1150,0,1);lp.textContent=Math.round((1-Math.pow(1-q,3))*100)+'%';if(q<1)requestAnimationFrame(tk)};requestAnimationFrame(tk);setTimeout(()=>$('#loader').remove(),2400)}
emit(); onScroll();
})();
</script>
